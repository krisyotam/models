image: ubuntu/lts
secrets:
  - 661293bf-f6d3-4ee1-8e74-34ea2fb70598
environment:
  VERCEL_ORG_ID: team_OoMniSEFMV1Arj9XJTTyujIC
  VERCEL_PROJECT_ID: prj_yrbQXyFOF3iJ5wXHe9yEi4b3xRtF
sources:
  - https://git.sr.ht/~krisyotam/models
tasks:
  - setup: |
      curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      sudo apt-get install -y nodejs
      sudo corepack enable
      sudo npm install -g vercel@latest
  - deploy: |
      cd models
      source ~/.config/vercel/auth.env
      vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      vercel build --prod --token="$VERCEL_TOKEN"
      vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
